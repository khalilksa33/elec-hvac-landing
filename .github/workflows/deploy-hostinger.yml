name: Deploy Yii2 Application to Hostinger

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    name: Deploy to Hostinger Web Hosting via SFTP / SSH
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Checkout Repository Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, xml, ctype, iconv, mysql, gd, pdo_mysql

      - name: 📦 Install Composer Dependencies (Production Mode)
        run: |
          composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: 📂 Deploy via SFTP to Hostinger (Subdomain works.dynapulsar.com)
        uses: SamKirsch/sftp-action@v1.0.0
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          password: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          port: ${{ secrets.HOSTINGER_SSH_PORT || '6588' }}
          local_path: './*'
          # Subdomain path: /home/u998578075/domains/dynapulsar.com/public_html/works/
          remote_path: ${{ secrets.HOSTINGER_REMOTE_PATH || '/home/u998578075/domains/dynapulsar.com/public_html/works/' }}
          delete_remote: false

      - name: ⚡ Post-Deployment Remote Commands (Subdomain Permissions & Cache)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          password: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          port: ${{ secrets.HOSTINGER_SSH_PORT || '6588' }}
          script: |
            cd ${{ secrets.HOSTINGER_REMOTE_PATH || '/home/u998578075/domains/dynapulsar.com/public_html/works/' }}
            chmod -R 777 runtime web/assets
            php yii migrate --interactive=0
            php yii cache/flush-all
