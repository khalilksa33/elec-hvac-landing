name: Deploy Yii2 Application to Hostinger

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    name: Deploy to Hostinger Web Hosting via SFTP / SSH
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Checkout Repository Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, xml, ctype, iconv, mysql, gd, pdo_mysql

      - name: 📦 Install Composer Dependencies (Production Mode)
        run: |
          composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: 📂 Deploy via SFTP to Hostinger (works.dynapulsar.com)
        env:
          RAW_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          SSH_PASSWORD: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT || '6588' }}
          REMOTE_PATH: ${{ secrets.HOSTINGER_REMOTE_PATH || '/home/u998578075/domains/dynapulsar.com/public_html/works/' }}
        run: |
          # Sanitize host name (remove https://, http://, or trailing slashes if accidentally pasted in secrets)
          CLEAN_HOST=$(echo "$RAW_HOST" | sed -e 's|^https://||' -e 's|^http://||' -e 's|/*$||' | tr -d '\r\n ')
          echo "Connecting to cleaned host: $CLEAN_HOST on port $SSH_PORT"
          sshpass -p "$SSH_PASSWORD" rsync -avz --delete-after -e "ssh -p $SSH_PORT -o StrictHostKeyChecking=no" ./ "$SSH_USER@$CLEAN_HOST:$REMOTE_PATH"

      - name: ⚡ Post-Deployment Remote Commands (Subdomain Permissions & Cache)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          password: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          port: ${{ secrets.HOSTINGER_SSH_PORT || '6588' }}
          script: |
            cd ${{ secrets.HOSTINGER_REMOTE_PATH || '/home/u998578075/domains/dynapulsar.com/public_html/works/' }}
            chmod -R 777 runtime web/assets
            php yii migrate --interactive=0
            php yii cache/flush-all
